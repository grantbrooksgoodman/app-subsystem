name: Release

# Every push to main mints a semantic-version tag and a GitHub release.
# Rules and override tokens: https://github.com/grantbrooksgoodman/swift-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: grantbrooksgoodman/swift-release@main
        with:
          initial-version: "31.0.0"
