name: Release

# Every push to main mints a new semantic version tag and a GitHub release.
# See .github/scripts/decide_bump.py for the bump rules and the override tokens
# ([major], [minor], [patch], [skip release]) you can put in a commit message.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Used only once, when no v* tag exists yet: HEAD is tagged with this version as-is.
  INITIAL_VERSION: "31.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous version
        id: prev
        run: |
          set -euo pipefail
          if git describe --tags --exact-match --match 'v[0-9]*' HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged; nothing to do."
            echo "state=tagged" >> "$GITHUB_OUTPUT"
          elif tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
            echo "Previous version: $tag"
            echo "state=bump" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No version tag yet; will seed v$INITIAL_VERSION."
            echo "state=seed" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide bump
        id: bump
        if: steps.prev.outputs.state == 'bump'
        run: |
          set -euo pipefail
          prev="${{ steps.prev.outputs.tag }}"
          python3 -I .github/scripts/public_api.py . "$prev" > /tmp/api_before.txt
          python3 -I .github/scripts/public_api.py . HEAD    > /tmp/api_after.txt
          python3 -I .github/scripts/api_diff.py /tmp/api_before.txt /tmp/api_after.txt --out-dir /tmp
          removed=$(wc -l < /tmp/api_removed.txt)
          added=$(( $(wc -l < /tmp/api_added.txt) + $(wc -l < /tmp/api_extended.txt) ))
          lines=$(git diff --numstat "$prev" HEAD -- Sources Package.swift | awk '{a+=$1; d+=$2} END {print a+d+0}')
          platform=0
          if git diff "$prev" HEAD -- Package.swift | grep -Eq '^[-+].*(swift-tools-version|\.iOS\(|\.macOS\(|\.tvOS\(|\.watchOS\(|\.visionOS\()'; then
            platform=1
          fi
          messages=$(git log --format=%B "$prev"..HEAD)
          python3 -I .github/scripts/decide_bump.py \
            --prev "$prev" --removed "$removed" --added "$added" \
            --lines "$lines" --platform-changed "$platform" --messages "$messages" \
            | tee -a "$GITHUB_OUTPUT"
          {
            echo "Changes since $prev: $lines line(s) in Sources/ and Package.swift."
            if [ -s /tmp/api_removed.txt ]; then
              echo; echo "### Public API removed or changed"; echo '```'; cat /tmp/api_removed.txt; echo '```'
            fi
            if [ -s /tmp/api_added.txt ]; then
              echo; echo "### Public API added"; echo '```'; cat /tmp/api_added.txt; echo '```'
            fi
            if [ -s /tmp/api_extended.txt ]; then
              echo; echo "### Public API extended (new defaulted parameters)"; echo '```'; cat /tmp/api_extended.txt; echo '```'
            fi
          } > /tmp/release_notes.md

      - name: Tag and release
        if: steps.prev.outputs.state == 'bump' && steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new="v${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new" -m "$new (${{ steps.bump.outputs.bump }} bump)"
          git push origin "$new"
          gh release create "$new" --verify-tag --title "$new" --generate-notes --notes-file /tmp/release_notes.md

      - name: Seed first version
        if: steps.prev.outputs.state == 'seed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new="v$INITIAL_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new" -m "$new (initial version)"
          git push origin "$new"
          gh release create "$new" --verify-tag --title "$new" --notes "Initial semantic version. Earlier history is unversioned."
